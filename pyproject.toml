[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1.0"
description = "Connecting ideas into code — an intelligent code agent"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.100.0",
    "google-genai>=2.0",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.30.0",
]
http-tool = [
    "httpx>=0.27.0",
]
browser-tool = [
    "playwright>=1.40.0",
]
qdrant = [
    "qdrant-client>=1.9.0",
]
all = [
    "synapse[test,http-tool,browser-tool,qdrant]",
]

[project.scripts]
synapse = "synapse.adapters.cli:main"

[tool.setuptools.packages.find]
include = ["synapse*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
