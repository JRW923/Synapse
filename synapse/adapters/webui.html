<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synapse</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --brand: #39c5cf;
    --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex: none;
  }
  header .logo { color: var(--brand); font-weight: 700; }
  header .session { color: var(--dim); font-size: 12px; margin-left: auto; }
  header .connector { margin-left: 12px; color: var(--ok); }
  header button {
    background: none; border: 1px solid var(--border); color: var(--dim);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  }
  header button:hover { color: var(--text); border-color: var(--dim); }
  #chat { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { max-width: 860px; margin: 0 auto 14px; display: flex; gap: 10px; }
  .msg .who { flex: none; width: 28px; height: 28px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .msg.user .who { background: #21262d; color: var(--dim); }
  .msg.agent .who { background: rgba(57,197,207,.15); color: var(--brand); }
  .msg .body { min-width: 0; flex: 1; }
  .msg .body pre {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; overflow-x: auto; margin: 6px 0; font-size: 13px;
  }
  .msg .body code { font-family: Consolas, monospace; }
  /* streaming panel: mirrors the structured CLI live display. */
  #live {
    max-width: 860px; margin: 0 auto 14px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--panel); padding: 10px 12px;
    display: none;
  }
  #live .live-header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  #live .status { color: var(--brand); font-size: 13px; }
  #live .status .spin {
    display: inline-block; animation: spin 1s steps(10) infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #live .meta, #live .stats { color: var(--dim); font-size: 12px; }
  #live .live-section { border-top: 1px solid var(--border); margin-top: 9px; padding-top: 8px; }
  #live .section-title { color: var(--dim); font-size: 11px; margin-bottom: 5px; }
  #live .stream { white-space: pre-wrap; font-size: 13px; max-height: 160px;
    overflow-y: auto; font-family: Consolas, monospace; }
  #live .tools { display: grid; gap: 3px; max-height: 150px; overflow-y: auto; }
  #live .tool-row { display: grid; grid-template-columns: 14px minmax(84px, auto) minmax(0, 1fr) auto;
    gap: 7px; align-items: baseline; color: var(--dim); font: 12px/1.5 Consolas, monospace; }
  #live .tool-row .tool-name { color: var(--text); }
  #live .tool-row .tool-args { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #live .tool-row .tool-meta { white-space: nowrap; }
  #live .tool-row.running .tool-mark { color: var(--brand); }
  #live .tool-row.ok .tool-mark, #live .tool-row.ok .tool-meta { color: var(--ok); }
  #live .tool-row.err .tool-mark, #live .tool-row.err .tool-meta { color: var(--err); }
  #live .swarm { display: grid; gap: 3px; color: var(--dim); font: 12px/1.5 Consolas, monospace; }
  #live .swarm .verified { color: var(--ok); }
  #live .swarm .verified.failed { color: var(--err); }
  .run-summary { max-width: 860px; margin: -4px auto 14px; border-left: 2px solid var(--brand);
    padding: 5px 10px; color: var(--dim); font-size: 12px; }
  .run-summary.failed { border-color: var(--err); }
  .run-summary .status { color: var(--text); font-weight: 600; }
  .run-summary .hint { display: block; margin-top: 2px; }
  @media (max-width: 600px) {
    #live .tool-row { grid-template-columns: 14px minmax(0, 1fr) auto; }
    #live .tool-row .tool-args { grid-column: 2 / 4; }
  }
  form {
    display: flex; gap: 8px; padding: 12px 16px; margin: 12px auto 12px;
    width: calc(100% - 32px); max-width: 860px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); flex: none;
  }
  textarea {
    flex: 1; background: var(--bg); color: var(--text); resize: none;
    border: none; outline: none; padding: 8px; font: inherit;
    max-height: 160px;
  }
  form button {
    background: var(--brand); color: #0d1117; border: none; border-radius: 6px;
    padding: 6px 16px; font-weight: 600; cursor: pointer; align-self: flex-end;
  }
  form button:disabled { opacity: .4; cursor: default; }
  /* approval prompt for confirmation-required tool calls */
  #confirm {
    max-width: 860px; margin: 0 auto 14px; border: 1px solid var(--warn);
    border-radius: 8px; background: var(--panel); padding: 12px 14px;
    display: none;
  }
  #confirm .title { color: var(--warn); font-weight: 600; }
  #confirm .detail { margin: 8px 0; font-size: 13px; }
  #confirm pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; overflow-x: auto; font-size: 12px; margin: 6px 0;
    max-height: 180px; overflow-y: auto;
  }
  #confirm .row { display: flex; gap: 8px; justify-content: flex-end; }
  #confirm button {
    border-radius: 6px; padding: 6px 16px; cursor: pointer; font-weight: 600;
    border: 1px solid var(--border); background: none; color: var(--text);
  }
  #confirm button.approve { background: var(--ok); color: #0d1117; border: none; }
  #confirm button.deny { border-color: var(--err); color: var(--err); }
  #pair {
    max-width: 860px; margin: 0 auto 14px; border: 1px solid var(--brand);
    border-radius: 8px; background: var(--panel); padding: 12px 14px;
    display: none;
  }
  #pair .title { color: var(--brand); font-weight: 600; }
  #pair .detail { margin: 8px 0; font-size: 13px; }
  #pair code { display: block; color: var(--text); font-size: 18px; padding: 6px 0; }
  #pair .row { display: flex; justify-content: flex-end; }
  #pair button { border-radius: 6px; padding: 6px 16px; cursor: pointer;
    border: 1px solid var(--border); background: none; color: var(--text); }
  /* settings modal: browser-supplied API key (local single-user) */
  #settings { position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 20; }
  #settings.show { display: flex; }
  #settings .box { background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 18px 20px; width: 380px; max-width: 92vw; }
  #settings h3 { margin: 0 0 4px; font-size: 15px; }
  #settings .hint { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  #settings label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  #settings input { width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; font: inherit; }
  #settings .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  #settings button { border-radius: 6px; padding: 6px 16px; cursor: pointer;
    font-weight: 600; border: 1px solid var(--border); background: none; color: var(--text); }
  #settings button.save { background: var(--brand); color: #0d1117; border: none; }
  #settings .err { color: var(--err); font-size: 12px; min-height: 16px; margin-top: 8px; }
  #settings .choice-btn { display: block; width: 100%; text-align: left; padding: 10px 12px;
    margin-bottom: 10px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); cursor: pointer; }
  #settings .choice-btn:hover { border-color: var(--brand); }
  #settings .choice-btn .choice-title { font-weight: 600; font-size: 14px; }
  #settings .choice-btn .choice-desc { color: var(--dim); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <span class="logo">◆ synapse</span>
  <span class="session" id="session"></span>
  <span class="session connector" id="connector"></span>
  <button onclick="pairLocalWorkspace()">连接本机</button>
  <button onclick="openSettings()">设置</button>
  <button onclick="newSession()">新会话</button>
</header>
<div id="chat"><div id="live">
  <div class="live-header">
    <span class="status"><span class="spin">⠋</span> <span id="label">连接中…</span></span>
    <span class="meta" id="meta"></span><span class="stats" id="stats"></span>
  </div>
  <section class="live-section" id="stream-section" hidden>
    <div class="section-title">模型输出</div><div class="stream" id="stream"></div>
  </section>
  <section class="live-section" id="tools-section" hidden>
    <div class="section-title">最近工具</div><div class="tools" id="tools"></div>
  </section>
  <section class="live-section" id="swarm-section" hidden>
    <div class="section-title">协作状态</div><div class="swarm" id="swarm"></div>
  </section>
</div><div id="confirm">
  <div class="title">⚠ 需要确认的操作</div>
  <div class="detail" id="confirm-detail"></div>
  <div class="row">
    <button class="deny" onclick="answer(false)">拒绝</button>
    <button class="approve" onclick="answer(true)">批准</button>
  </div>
</div><div id="pair">
  <div class="title">本机配对</div>
  <div class="detail" id="pair-status"></div>
  <code id="pair-code"></code>
  <div class="row"><button onclick="closePairing()">关闭</button></div>
</div></div>
<form onsubmit="return send(event)">
  <textarea id="input" rows="1" placeholder="输入任务，Enter 发送，Shift+Enter 换行"
    onkeydown="return keydown(event)" oninput="grow(this)"></textarea>
  <button id="sendbtn">发送</button>
</form>
<div id="settings">
  <div class="box">
    <h3>开始使用</h3>
    <div class="hint">Key 仅保存在本机进程内存，不写入任何服务器文件。每次启动需重新填写（本地优先用法）。</div>

    <div id="cfg-choice">
      <button class="choice-btn" onclick="showFreeModel()">
        <div class="choice-title">使用免费模型</div>
        <div class="choice-desc">OpenRouter 小模型，无需付费，推荐试用</div>
      </button>
      <button class="choice-btn" onclick="showCustomModel()">
        <div class="choice-title">配置我自己的模型</div>
        <div class="choice-desc">填 Provider / Model / API Key</div>
      </button>
      <div class="row">
        <button onclick="closeSettings()">取消</button>
      </div>
    </div>

    <div id="cfg-free" hidden>
      <label>OpenRouter API Key</label>
      <input id="cfg-free-key" type="password" placeholder="sk-or-..." autocomplete="off">
      <div class="hint">将使用 OpenRouter 免费模型（在 openrouter.ai 免费注册获取 key）。</div>
      <div class="err" id="cfg-free-err"></div>
      <div class="row">
        <button onclick="showChoice()">返回</button>
        <button class="save" onclick="saveFreeModel()">保存</button>
      </div>
    </div>

    <div id="cfg-custom" hidden>
      <label>Provider</label>
      <input id="cfg-provider" autocomplete="off" placeholder="如 openai / anthropic / deepseek / google / ollama">
      <label>Model</label>
      <input id="cfg-model" autocomplete="off" placeholder="模型 ID">
      <label>API Key</label>
      <input id="cfg-key" type="password" placeholder="sk-..." autocomplete="off">
      <div class="err" id="cfg-err"></div>
      <div class="row">
        <button onclick="showChoice()">返回</button>
        <button class="save" onclick="saveConfig()">保存</button>
      </div>
    </div>
  </div>
</div>
<script>
let sessionId = null, busy = false, spinner = null, elapsed = null, timer = null;
let pendingConfirm = null;
let connectorId = null, connectorToken = null, currentPairing = null;
let liveState = null;
const $ = id => document.getElementById(id);
const MAX_STREAM_CHARS = 1600;
const MAX_TOOL_ROWS = 5;
const SENSITIVE_PARAM = /(?:api[_-]?key|token|authorization|password|secret|cookie)/i;

function numberOrZero(value) {
  const parsed = Number(value);
  return Number.isFinite(parsed) ? Math.max(0, parsed) : 0;
}

function formatTokenCount(value) {
  value = numberOrZero(value);
  if (value >= 1000000) return (value / 1000000).toFixed(1) + "M";
  if (value >= 1000) return (value / 1000).toFixed(1) + "k";
  return String(value);
}

function clipText(value, limit) {
  value = String(value || "").replace(/\s+/g, " ").trim();
  return value.length > limit ? value.slice(0, Math.max(0, limit - 3)) + "..." : value;
}

function summarizeParams(params) {
  if (!params || typeof params !== "object") return "";
  return Object.entries(params).slice(0, 8).map(([key, value]) => {
    if (SENSITIVE_PARAM.test(key)) return key + "=<redacted>";
    let text;
    try { text = typeof value === "string" ? value : JSON.stringify(value); }
    catch (_) { text = String(value); }
    return key + "=" + clipText(text, 80);
  }).join(", ");
}

function resetLiveState() {
  liveState = {
    tokens: { input: 0, output: 0 },
    baseline: { input: 0, output: 0 },
    iteration: 0,
    toolArgs: new Map(),
    tools: [],
    workers: new Map(),
    reviews: [],
    votes: [],
    verified: null,
  };
  $("stream").textContent = "";
  $("tools").replaceChildren();
  $("swarm").replaceChildren();
  $("stats").textContent = "";
  $("stream-section").hidden = true;
  $("tools-section").hidden = true;
  $("swarm-section").hidden = true;
}

function renderStats() {
  if (!liveState) return;
  const { input, output } = liveState.tokens;
  const parts = [
    "tokens in " + formatTokenCount(input),
    "out " + formatTokenCount(output),
    "total " + formatTokenCount(input + output) + " tok",
  ];
  if (liveState.iteration) parts.push("iter " + liveState.iteration);
  $("stats").textContent = parts.join(" · ");
}

function addTool(row) {
  if (!liveState) return;
  liveState.tools.push(row);
  if (liveState.tools.length > MAX_TOOL_ROWS) liveState.tools.shift();
  renderTools();
}

function renderTools() {
  if (!liveState) return;
  const tools = $("tools");
  tools.replaceChildren();
  for (const row of liveState.tools) {
    const line = document.createElement("div");
    line.className = "tool-row " + (row.success ? "ok" : "err");
    const mark = document.createElement("span");
    mark.className = "tool-mark";
    mark.textContent = row.success ? "✓" : "!";
    const name = document.createElement("span");
    name.className = "tool-name";
    name.textContent = row.name;
    const args = document.createElement("span");
    args.className = "tool-args";
    args.textContent = row.args || "-";
    const meta = document.createElement("span");
    meta.className = "tool-meta";
    meta.textContent = row.meta;
    line.append(mark, name, args, meta);
    tools.appendChild(line);
  }
  $("tools-section").hidden = !liveState.tools.length;
}

function renderSwarm() {
  if (!liveState) return;
  const swarm = $("swarm");
  swarm.replaceChildren();
  for (const [id, worker] of liveState.workers) {
    const line = document.createElement("div");
    line.textContent = "[swarm] " + (worker.role || "worker") + " (" + id + "): " + worker.status;
    swarm.appendChild(line);
  }
  if (liveState.reviews.length || liveState.votes.length) {
    const rejects = liveState.reviews.filter(review => review.verdict === "reject").length;
    const line = document.createElement("div");
    line.textContent = "[swarm] reviews=" + liveState.reviews.length +
      " rejected=" + rejects + " votes=" + liveState.votes.length;
    swarm.appendChild(line);
  }
  if (liveState.verified !== null) {
    const line = document.createElement("div");
    line.className = "verified" + (liveState.verified === "success" ? "" : " failed");
    line.textContent = "[swarm] verified: " + liveState.verified;
    swarm.appendChild(line);
  }
  $("swarm-section").hidden = !swarm.childElementCount;
}

function addRunSummary(result) {
  const metrics = result.metrics || {};
  const hasMetricTokens = Object.prototype.hasOwnProperty.call(metrics, "tokens_input") ||
    Object.prototype.hasOwnProperty.call(metrics, "tokens_output");
  const input = hasMetricTokens ? numberOrZero(metrics.tokens_input) : liveState.tokens.input;
  const output = hasMetricTokens ? numberOrZero(metrics.tokens_output) : liveState.tokens.output;
  const status = String(result.status || "failed");
  const statusText = { success: "成功", partial: "部分完成", failed: "失败" }[status] || status;
  const pieces = ["耗时 " + (numberOrZero(metrics.duration_ms) / 1000).toFixed(1) + "s",
    "token " + formatTokenCount(input + output)];
  if (Object.prototype.hasOwnProperty.call(metrics, "tool_call_count")) {
    pieces.push("工具 " + numberOrZero(metrics.tool_success_count) + "/" +
      numberOrZero(metrics.tool_call_count) + " 成功");
  }
  const summary = document.createElement("div");
  summary.className = "run-summary" + (status === "success" ? "" : " failed");
  const label = document.createElement("span");
  label.className = "status";
  label.textContent = "状态：" + statusText;
  summary.append(label, document.createTextNode(" · " + pieces.join(" · ")));
  const hint = result.run_score && result.run_score.process_hint;
  if (typeof hint === "string" && hint.trim()) {
    const hintLine = document.createElement("span");
    hintLine.className = "hint";
    hintLine.textContent = "提示：" + clipText(hint, 240);
    summary.appendChild(hintLine);
  }
  $("chat").insertBefore(summary, $("live"));
  $("chat").scrollTop = $("chat").scrollHeight;
}

function closePairing() {
  currentPairing = null;
  $("pair").style.display = "none";
}

async function pairLocalWorkspace() {
  if (busy) return;
  try {
    const res = await fetch("/connectors/pair", { method: "POST" });
    if (!res.ok) throw new Error("无法创建配对码");
    const pairing = await res.json();
    currentPairing = pairing;
    $("pair-status").textContent =
      "在本机运行 synapse connect --server " + location.origin +
      " --workspace <本机项目目录> --pair，然后输入此配对码";
    $("pair-code").textContent = pairing.pair_code;
    $("pair").style.display = "block";
    pollPairing(pairing);
  } catch (err) {
    $("pair-status").textContent = "配对失败：" + err.message;
    $("pair-code").textContent = "";
    $("pair").style.display = "block";
  }
}

async function pollPairing(pairing) {
  while (currentPairing === pairing) {
    try {
      const res = await fetch("/connectors/pair/" + pairing.pair_id, {
        headers: { "Authorization": "Bearer " + pairing.browser_token },
      });
      if (!res.ok) throw new Error("配对已失效");
      const state = await res.json();
      if (state.status === "connected") {
        connectorId = state.connector_id;
        connectorToken = pairing.browser_token;
        $("connector").textContent = "本机：" + state.name;
        $("pair-status").textContent = "已连接";
        $("pair-code").textContent = "";
        return;
      }
    } catch (err) {
      if (currentPairing === pairing) {
        $("pair-status").textContent = "配对失败：" + err.message;
        $("pair-code").textContent = "";
      }
      return;
    }
    await new Promise(resolve => setTimeout(resolve, 1000));
  }
}

// Browser-supplied API key: if the server has no key configured, prompt for it.
let freeModel = { provider: "openrouter", model: "openai/gpt-oss-20b:free" };
async function checkConfig() {
  try {
    const r = await fetch("/config");
    const d = await r.json();
    if (d.free_model) freeModel = d.free_model;
    if (!d.configured) openSettings();
  } catch (e) { /* server error surfaces on first send instead */ }
}
function showChoice() {
  $("cfg-choice").hidden = false;
  $("cfg-free").hidden = true;
  $("cfg-custom").hidden = true;
}
function showFreeModel() {
  $("cfg-choice").hidden = true;
  $("cfg-free").hidden = false;
  $("cfg-custom").hidden = true;
  $("cfg-free-err").textContent = "";
  $("cfg-free-key").focus();
}
function showCustomModel() {
  $("cfg-choice").hidden = true;
  $("cfg-free").hidden = true;
  $("cfg-custom").hidden = false;
  $("cfg-err").textContent = "";
  $("cfg-key").focus();
}
function openSettings() {
  $("settings").classList.add("show");
  showChoice();
}
function closeSettings() {
  $("settings").classList.remove("show");
}
async function saveFreeModel() {
  const api_key = $("cfg-free-key").value.trim();
  if (!api_key) { $("cfg-free-err").textContent = "API Key 不能为空"; return; }
  try {
    const res = await fetch("/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider: freeModel.provider, model: freeModel.model, api_key }),
    });
    if (!res.ok) { $("cfg-free-err").textContent = "保存失败"; return; }
    closeSettings();
  } catch (e) {
    $("cfg-free-err").textContent = "保存失败：" + e.message;
  }
}
async function saveConfig() {
  const provider = $("cfg-provider").value.trim();
  const model = $("cfg-model").value.trim();
  const api_key = $("cfg-key").value.trim();
  if (!api_key) { $("cfg-err").textContent = "API Key 不能为空"; return; }
  try {
    const res = await fetch("/config", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider, model, api_key }),
    });
    if (!res.ok) { $("cfg-err").textContent = "保存失败"; return; }
    closeSettings();
  } catch (e) {
    $("cfg-err").textContent = "保存失败：" + e.message;
  }
}
checkConfig();
checkLocalConnector();

// 单进程「synapse web」模式：服务端已自动建好本地 connector 并绑定，
// 无需手动点「连接本机」或输入配对码，直接认领即可。
async function checkLocalConnector() {
  try {
    const res = await fetch("/connectors/local");
    const d = await res.json();
    if (!d.connector_id) return;
    connectorId = d.connector_id;
    connectorToken = d.browser_token;
    $("connector").textContent = "本机：" + (d.name || "已连接");
    $("pair").style.display = "none";
    const btn = document.querySelector("button[onclick='pairLocalWorkspace()']");
    if (btn) btn.style.display = "none";
  } catch (e) { /* 非本地模式或尚未就绪，忽略 */ }
}

async function answer(approve) {
  if (pendingConfirm === null) return;
  const id = pendingConfirm; pendingConfirm = null;
  $("confirm").style.display = "none";
  $("label").textContent = "继续执行…";
  try {
    await fetch("/confirm/" + id, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ approve }),
    });
  } catch (e) { /* stream will surface the timeout-deny if this failed */ }
}

function newSession() {
  if (busy && !confirm("任务进行中，确定放弃？")) return;
  sessionId = null; $("session").textContent = "";
  document.querySelectorAll(".msg, .run-summary").forEach(e => e.remove());
  resetLiveState();
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  // minimal escaping, then restore <pre>/<code> blocks as elements
  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  div.innerHTML = "<div class='who'>" + (role === "user" ? "你" : "◆") + "</div>" +
    "<div class='body'>" + esc(text)
      .split(/```(\w*)\n?/)
      .reduce((acc, part, i, arr) =>
        i % 2 === 1 ? acc : acc + (arr[i-1] !== undefined
          ? "<pre><code>" + part + "</code></pre>" : part),
        "") + "</div>";
  $("chat").insertBefore(div, $("live"));
  $("chat").scrollTop = $("chat").scrollHeight;
}

function grow(t) { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
function keydown(e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); return send(e); }
}

const PHASES = {
  thinking: "分析任务", calling_llm: "调用模型", done: "任务完成",
  executing_tool: "执行工具",
  token_budget: "接近 token 预算", context_timeout: "上下文检索超时",
};

async function send(e) {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || busy) return false;
  busy = true; $("sendbtn").disabled = true;
  addMsg("user", text);
  $("input").value = ""; grow($("input"));
  resetLiveState();
  $("label").textContent = "开始…";
  $("live").style.display = "block";
  spinner = setInterval(() => {
    const s = $("live").querySelector(".spin");
    const frames = ["⠋","⠙","⠹","⠸","⠼","⠴","⠦","⠧","⠇","⠏"];
    s.textContent = frames[(frames.indexOf(s.textContent) + 1) % frames.length];
  }, 100);
  elapsed = Date.now();
  $("meta").textContent = "0s";
  timer = setInterval(() => {
    $("meta").textContent = Math.round((Date.now() - elapsed) / 1000) + "s";
  }, 1000);

  // POST + manual SSE line parsing via fetch streaming
  let events = [];
  try {
    const request = {
      task: text,
      session_id: sessionId,
    };
    if (connectorId && connectorToken) {
      request.connector_id = connectorId;
      request.connector_token = connectorToken;
    }
    const res = await fetch("/run/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(request),
    });
    if (!res.ok) {
      let msg = "模型未配置，请先点击「设置」填入你的 API Key。";
      try { msg = (await res.json()).detail || msg; } catch (e) {}
      stopLive();
      busy = false; $("sendbtn").disabled = false;
      addMsg("agent", msg);
      return false;
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (chunk.startsWith("data: "))
          handle(JSON.parse(chunk.slice(6)));
      }
    }
  } catch (err) {
    addMsg("agent", "连接错误：" + err.message);
  }
  stopLive();
  busy = false; $("sendbtn").disabled = false;
  $("input").focus();
  return false;
}

function handle(item) {
  if (item.type === "event") {
    const ev = item.event;
    if (ev.event_type === "agent_progress") {
      const message = ev.message || "";
      if (ev.phase === "calling_llm") {
        liveState.baseline = { ...liveState.tokens };
        const match = /^Iteration\s+(\d+)\s*:/.exec(message);
        if (match) liveState.iteration = Number(match[1]);
        $("stream").textContent = "";
        $("stream-section").hidden = true;
        $("label").textContent = PHASES.calling_llm;
        renderStats();
        return;
      }
      const tokenMatch = /^tokens=(\d+)\+(\d+)$/.exec(message);
      if (tokenMatch) {
        liveState.tokens.input = Number(tokenMatch[1]);
        liveState.tokens.output = Number(tokenMatch[2]);
        renderStats();
        return;
      }
      $("label").textContent = PHASES[ev.phase] || message || "处理中";
    } else if (ev.event_type === "llm_token") {
      const stream = $("stream");
      stream.textContent = (stream.textContent + (ev.text || "")).slice(-MAX_STREAM_CHARS);
      $("stream-section").hidden = !stream.textContent;
      stream.scrollTop = stream.scrollHeight;
      if (ev.usage && typeof ev.usage === "object") {
        if (Number.isFinite(Number(ev.usage.input))) {
          liveState.tokens.input = liveState.baseline.input + Number(ev.usage.input);
        }
        if (Number.isFinite(Number(ev.usage.output))) {
          liveState.tokens.output = liveState.baseline.output + Number(ev.usage.output);
        }
        renderStats();
      }
    } else if (ev.event_type === "tool_call_started") {
      const args = summarizeParams(ev.tool_params);
      liveState.toolArgs.set(ev.tool_name, args);
      $("label").textContent = "执行工具 · " + ev.tool_name + (args ? "(" + args + ")" : "");
    } else if (ev.event_type === "tool_call_completed") {
      const args = liveState.toolArgs.get(ev.tool_name) || "";
      liveState.toolArgs.delete(ev.tool_name);
      const files = Array.isArray(ev.files_touched) ? ev.files_touched.length : 0;
      const suffix = files ? " · 文件 " + files : "";
      const sandbox = ev.sandbox_violation ? " · 沙箱拒绝" : "";
      addTool({
        success: Boolean(ev.success),
        name: ev.tool_name || "tool",
        args,
        meta: numberOrZero(ev.duration_ms) + "ms" + suffix + sandbox,
      });
      $("label").textContent = (ev.success ? "工具完成 · " : "工具失败 · ") + ev.tool_name;
    } else if (ev.event_type === "background_result") {
      const taskId = String(ev.task_id || "").slice(0, 8);
      addTool({
        success: Boolean(ev.success),
        name: "bg:" + taskId,
        args: clipText(ev.stdout || ev.stderr || "", 80),
        meta: "",
      });
      $("label").textContent = "后台任务完成 · " + taskId;
    } else if (ev.event_type === "worker_spawned") {
      liveState.workers.set(ev.agent_id || ev.role || "worker", {
        role: ev.role || "worker", status: "running",
      });
      renderSwarm();
    } else if (ev.event_type === "worker_completed") {
      const id = ev.agent_id || ev.role || "worker";
      liveState.workers.set(id, {
        role: ev.role || (liveState.workers.get(id) || {}).role || "worker",
        status: ev.status || "completed",
      });
      renderSwarm();
    } else if (ev.event_type === "review_submitted") {
      liveState.reviews.push({ verdict: ev.verdict || "" });
      renderSwarm();
    } else if (ev.event_type === "vote_cast") {
      liveState.votes.push({ decision: ev.decision || "" });
      renderSwarm();
    } else if (ev.event_type === "swarm_verified") {
      liveState.verified = ev.status || "unknown";
      renderSwarm();
    }
  } else if (item.type === "confirm") {
    pendingConfirm = item.request_id;
    const r = item.request;
    $("confirm-detail").innerHTML =
      "<b>" + r.tool_name + "</b>（风险等级：" + r.risk_level + "）" +
      "<pre>" + JSON.stringify(r.tool_params, null, 2)
        .replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])) + "</pre>";
    $("confirm").style.display = "block";
    $("label").textContent = "等待确认…";
  } else if (item.type === "done") {
    const result = item.result || {};
    sessionId = result.session_id || sessionId;
    $("session").textContent = sessionId ? sessionId.slice(0, 8) : "";
    addMsg("agent", result.output || "(无输出)");
    addRunSummary(result);
  } else if (item.type === "error") {
    addMsg("agent", "任务失败：" + item.error);
  }
}

function stopLive() {
  clearInterval(spinner); clearInterval(timer);
  $("live").style.display = "none";
  $("confirm").style.display = "none";
  pendingConfirm = null;
}
</script>
